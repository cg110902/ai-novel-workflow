book_title: 示例标题
platform: fanqie
word_min: 2000
word_max: 2500

# 正文禁用字词(对话/系统消息/内心戏 豁免) 
# 【硬性限制】以下词汇每章仅限使用一次：
# 不是、没有、冷（笑、愣、眼皮）
# 替代方案见 docs/词汇替换指南.md
banned: [不是, 没有, 冷, 笑, 愣, 眼皮]
# 固定词组白名单(含禁用字但不违规)
banned_whitelist: [怕不是, 没有之一, 冷不丁]

thunder: [洋洋洒洒]

cliche: [面不改色, 淡淡的, 眼皮一跳, 瞳孔骤缩, 眼里闪过一丝, 语气平淡, 不慌不忙, 不紧不慢, 心中一动, 微微一, 满脸阴沉, 一脸阴沉, 面无表情, 意味深长, 四目相对]

adverbs: [缓缓, 微微, 轻轻, 淡淡, 静静, 深深, 狠狠, 紧紧, 顿时, 瞬间, 刹那, 猛地, 骤然, 倏地, 非常, 十分, 极其, 特别, 格外]

connectives: [因为, 所以, 于是, 然而, 但是, 不过, 不仅, 而且, 同时, 与此同时, 毕竟, 况且, 因此, 从而]

explanation: [这说明, 这意味着, 也就是说, 换句话说, 总而言之, 总之, 由此可见, 说白了, 换句话说]

godview: [殊不知, 他不知道的是, 他不知道, 他看不见的地方, 而在他不知道, 多年以后, 后来他才知道]

preach: [他终于明白, 这一刻, 他懂了, 这就是, 的真谛, 不过是一场]

emotion: [感到, 感到一阵, 心中涌起, 心中一, 涌起一股, 一阵寒意, 一股暖流, 一阵热流]

idioms: [洋洋洒洒]

# 具体物名=对外说了必暴露 → 硬泄露
info_hard: [金手指, 岁月馈赠]
# 主角会对系统喊的词 → 软泄露(人工裁决说话对象)
info_soft: [系统, 签到, 观气术, 回天丹, 洗髓丹, 灵根, 炼气, 筑基, 元婴, 化神, 灵石, 丹药, 灵器]
info_self_ok: true

characters: [江临, 赵天龙, 苏浅浅, 孙伯, 燕惊鸿]
fingerprint_江临: [这破, 苟, 装孙子]
fingerprint_赵天龙: [本少, 你也配, 废物]
fingerprint_苏浅浅: [师兄, 我不信]
fingerprint_孙伯: [娃子, 瞎折腾]
fingerprint_燕惊鸿: [本座, 有意思, 小子]

gaze_words: [看, 望, 盯, 瞥, 瞅, 瞧, 打量, 凝视, 扫视, 环顾, 目光, 眼神, 视线, 抬头, 低头, 转头, 回头, 四目相对, 对视]
gaze_per_1000: 25

gesture_words: [皱眉, 点头, 摇头, 摆手, 耸肩, 叹气, 冷笑, 挑眉, 眯眼, 咧嘴, 咽口水, 捏拳, 攥拳, 咬牙, 腿软, 冷汗, 咽唾沫, 转身, 挥手, 跺脚, 捋须, 抿嘴, 抿唇, 翻白眼]
gesture_reuse_max: 3

short_len: 12
long_len: 30
short_pct_min: 15
short_pct_max: 45
long_pct_min: 5
one_line_para_min: 30
para_avg_max: 45
dialogue_ratio_min: 0.30
dialogue_ratio_max: 0.60
